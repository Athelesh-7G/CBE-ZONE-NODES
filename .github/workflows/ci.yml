name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # C++ verification suite (verification/): differential, property, mutation tests
  # and the TypeScript bridge, under both g++ and clang++.
  cpp:
    name: cpp (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, cxx: g++ }
          - { name: clang, cxx: clang++ }
    env:
      CXX: ${{ matrix.cxx }}
      CBE_BUILD_DIR: verification/build/${{ matrix.name }}
      CBE_JUNIT: verification/build/junit-${{ matrix.name }}.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:cpp
      - name: Benchmark smoke test (checks the queues agree; timings are not asserted)
        run: '"$CBE_BUILD_DIR/cbe_bench" --max-v 2048 --quick true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.name }}
          path: verification/build/junit-*.xml

  # Same suite built with AddressSanitizer + UndefinedBehaviorSanitizer.
  # continue-on-error: this job has not yet been observed on a GitHub runner (ASan can
  # fail on some runner kernel/clang combinations). Remove it once it has run green.
  cpp-sanitizers:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CXX: clang++
      CBE_SANITIZE: "ON"
      CBE_MUTATION: "0"
      CBE_BUILD_DIR: verification/build/asan-ubsan
      CBE_JUNIT: verification/build/junit-asan-ubsan.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Known runner issue: high ASLR entropy breaks sanitizer shadow memory mapping.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - run: npm run test:cpp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-asan-ubsan
          path: verification/build/junit-*.xml
